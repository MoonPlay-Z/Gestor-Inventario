<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- High-legibility Squircle container for Favicon / App Icon (16px to 64px crisp) -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />

  <!-- Clean inner POS terminal / paper receipt silhouette -->
  <rect x="14" y="10" width="36" height="42" rx="5" fill="#FFFFFF" />

  <!-- Contactless / Chip accent dot -->
  <circle cx="32" cy="16" r="2.5" fill="#2563EB" />
  
  <!-- Credit card entering top slot -->
  <rect x="36" y="7" width="16" height="10" rx="2" fill="url(#favGold)" transform="rotate(12 36 7)" />

  <!-- Basket & JA Monogram Core -->
  <!-- Cart body in cyan -->
  <path d="M 20 25 L 44 25 L 40 37 L 24 37 Z" fill="url(#favCyan)" />
  
  <!-- Monogram A / speed stripe in Gold -->
  <path d="M 28 37 L 32 27 L 36 37" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="29.5" y1="34" x2="34.5" y2="34" stroke="#F59E0B" stroke-width="1.8" />

  <!-- Cart handle and frame (J shape) -->
  <path d="M 46 21 L 43 25 L 39 42 L 23 42" fill="none" stroke="#1D4ED8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High contrast wheels -->
  <circle cx="26" cy="46" r="3.2" fill="#0F172A" />
  <circle cx="26" cy="46" r="1.2" fill="#38BDF8" />
  
  <circle cx="38" cy="46" r="3.2" fill="#0F172A" />
  <circle cx="38" cy="46" r="1.2" fill="#38BDF8" />
</svg>
