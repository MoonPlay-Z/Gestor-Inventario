<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciando Gestor de Inventario...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .logo-ring {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 28px;
    }
    .logo-ring svg {
      position: absolute;
      top: 0; left: 0;
      animation: spin 2s linear infinite;
    }
    .logo-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.4rem;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 36px;
    }

    .progress-track {
      width: 260px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 99px;
      width: 0%;
    }

    .status-row {
      width: 260px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.78rem;
    }
    .status {
      font-size: 0.78rem;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .percent {
      color: #93c5fd;
      font-variant-numeric: tabular-nums;
    }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 0.72rem;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="logo-ring">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="44" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="4"/>
      <circle cx="48" cy="48" r="44" fill="none" stroke="#3b82f6" stroke-width="4"
        stroke-dasharray="200 80" stroke-linecap="round"/>
    </svg>
    <div class="logo-icon">📦</div>
  </div>

  <h1>Gestor de Inventario</h1>
  <p class="subtitle">Sistema POS &amp; Facturación</p>

  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="status-row">
    <p class="status" id="status-text">Iniciando aplicación...</p>
    <p class="percent" id="percent-text">0%</p>
  </div>

  <p class="version">v1.0.0</p>
</body>
</html>
